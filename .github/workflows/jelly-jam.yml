name: Jelly Jam checks
on:
  push:
    paths:
      - 'jelly-jam/**'
      - '.github/workflows/jelly-jam.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jelly-jam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check source transfer and JavaScript
        run: |
          cd jelly-jam
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name, expected in json.loads(Path('source-hashes.json').read_text()).items():
              data=Path(name).read_bytes()
              actual=hashlib.sha256(data).hexdigest()
              assert actual==expected, 'Source differs from locally tested file: '+name
          PY
          for file in *.js; do node --check "$file"; done
      - name: Solve all ten levels and check mechanics
        run: node jelly-jam/tests/engine.cjs
      - name: Build portable version and install test browser
        run: |
          python3 jelly-jam/build.py
          python3 -m pip install -r jelly-jam/tests/requirements.txt
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Keyboard, mobile, native multitouch and screen tests
        env:
          JELLY_TEST_HTTP: '1'
        run: python3 jelly-jam/tests/smoke.py
      - name: Real online play through the public room service
        env:
          JELLY_NETWORK_CLOUD: '1'
        run: python3 jelly-jam/tests/network.py
      - name: Retain test results, screenshots and portable game
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jelly-jam-tested
          path: |
            jelly-jam/tests/*results.json
            jelly-jam/tests/*.png
            jelly-jam/jelly-jam.html
          retention-days: 14
