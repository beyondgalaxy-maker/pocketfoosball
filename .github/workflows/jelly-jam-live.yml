name: Jelly Jam 2 live-site verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jelly-jam-live.yml'
      - 'jelly-jam/tests/live-v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install browser
        run: |
          python3 -m pip install -r jelly-jam/tests/requirements.txt
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Verify exact deployed assets
        run: python3 jelly-jam/tests/live-v2.py
      - name: Play the public website on desktop and mobile layouts
        env:
          JELLY_TEST_URL: https://beyondgalaxy-maker.github.io/pocketfoosball/jelly-jam/
        run: python3 jelly-jam/tests/browser-v2.py
      - name: Real online play and tab-return regression on the public website
        env:
          JELLY_TEST_URL: https://beyondgalaxy-maker.github.io/pocketfoosball/jelly-jam/
          JELLY_NETWORK_CLOUD: '1'
        run: python3 jelly-jam/tests/network-v2.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jelly-jam-2-live
          path: jelly-jam/tests/v2/*
          retention-days: 14
