name: Verify online multiplayer
on:
  push:
    branches: [main]
    paths:
      - online.js
      - v12.js
      - network-v12.py
      - index.html
      - .github/workflows/online-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Install real browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Exercise real community signaling and WebRTC
        run: python3 network-v12.py
      - name: Save source and network verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocketfoosball-online-check
          path: |
            *.js
            *.html
            *.css
            network-v12.py
            network-check-v12/
          retention-days: 7
          if-no-files-found: error
