name: Test Pocket Foosball
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.cjs'
      - '*.py'
      - index.html
      - styles.css
      - .github/workflows/verify-upload.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketfoosball-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Test rolling, recovery, adaptive controls and keybindings
        run: |
          node -e "const F=require('./engine');require('./rolling').installPhysics(F);require('./bot-control')(F);require('./v8-tests.cjs')"
          node v9-tests.cjs
          node v10-tests.cjs
      - name: Build standalone game
        run: python3 build.py
      - name: Install browser for public-site verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Verify deployed website without login
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 site-v10.py
      - name: Save tested game and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocketfoosball-assets
          path: |
            *.js
            *.cjs
            *.html
            *.css
            *.py
            *.md
            *test-results.json
            site-v10-results.json
            site-check-v10/*.png
            site/index.html
          retention-days: 7
          if-no-files-found: error
