name: Test Pocket Foosball
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.cjs'
      - '*.py'
      - index.html
      - styles.css
      - .github/workflows/verify-upload.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketfoosball-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Test rolling, recovery and adaptive controls
        run: node v8-tests.cjs
      - name: Build standalone game
        run: python3 build.py
      - name: Save tested game and report
        uses: actions/upload-artifact@v7
        with:
          name: pocketfoosball-assets
          path: |
            *.js
            *.cjs
            *.html
            *.css
            *.py
            *.md
            v8-test-results.json
            site/index.html
          retention-days: 7
          if-no-files-found: error
