name: Test Pocket Foosball
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.cjs'
      - '*.py'
      - index.html
      - styles.css
      - .github/workflows/verify-upload.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketfoosball-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Test contacts, recovery, two-hand budgets and multiplayer protocol
        run: |
          node --require ./tests-preload-v13.cjs probe-v13.cjs
          for suite in v8-tests.cjs v9-tests.cjs v10-tests.cjs v11-tests.cjs v12-tests.cjs rail-intent-tests.cjs v13-tests.cjs; do
            node --require ./tests-preload-v13.cjs "$suite"
          done
      - name: Build standalone game
        run: python3 build.py
      - name: Install browser for public-site verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Verify exact deployed assets and saved layouts without login
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 site-v13.py
      - name: Exercise taps and a real match on the public website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GAME_URL: https://beyondgalaxy-maker.github.io/pocketfoosball/?v=13
        run: |
          python3 browser-v13.py
          python3 network-v13.py
      - name: Save tested game and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocketfoosball-assets
          path: |
            *.js
            *.cjs
            *.html
            *.css
            *.py
            *.md
            *test-results.json
            rail-v12-comparison.json
            site-check-v13/
            browser-check-v13/
            network-check-v13/
            site/index.html
          retention-days: 7
          if-no-files-found: error
